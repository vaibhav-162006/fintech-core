services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: fintech
    ports:
      - "5433:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fintech"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    ports:
      - "4001:4000"
    environment:
      DATABASE_URL: postgres://postgres:dev@db:5432/fintech
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
